  - id: headers-not-deployed
    note: >-
      BLOCKING FOR LAUNCH. _headers is tracked at the REPO ROOT, not in public/.
      eleventy.config.js:11 passes through public/ -> "/", so robots.txt (which
      IS in public/) reaches _site/robots.txt, but _headers never does - _site/
      contains only assets, details, index.html, robots.txt, rsvp. Netlify
      publishes _site, so Referrer-Policy: no-referrer and
      X-Content-Type-Options: nosniff are NOT applied on the live site. This
      fails two Stage 10 criteria directly. It matters more since Stage 9: the
      new calendar.google.com link would hand Google the site address, and
      footer.liquid:8-10 states the origin is the secret this project protects.
      Fix is to move the file to public/_headers; verify _site/_headers exists
      after a build. Needs its own stage.
    decided: 2026-08-18
    raised_by: Stage 10 walkthrough

