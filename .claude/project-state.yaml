  - id: ics-description-unfolded
    note: >-
      DESCRIPTION is 102 octets; RFC 5545 3.1 says fold at 75. The bytes are
      dictated by the contract's "THE FILE, EXACTLY" block and were reproduced
      exactly, so this is the contract's to answer. Every mainstream client
      accepts long unfolded lines; recommendation is to leave it. Recorded so
      "RFC 5545, minimal" is not read as verified-conformant.
    decided: 2026-08-18
    raised_by: L1 code-reviewer

  - id: ics-text-escaping-at-stage-10
    note: >-
      HAZARD FOR THE STAGE 10 HUMAN STEP. Commas are structural in an iCalendar
      TEXT value. LOCATION is currently "TBC - address in the group chat" and is
      clean, but a real address ("123 Example St, Oakland, CA") must be written
      "123 Example St\, Oakland\, CA" in the .ics or parsers read it as
      multi-valued and clients truncate at the first comma. Same for ; and \.
      The calendar URL needs percent-encoding instead - a DIFFERENT rule for the
      same value in the two places that must agree. Belongs written into
      10-launch.md before anyone swaps the mock values.
    decided: 2026-08-18
    raised_by: L1 code-reviewer

