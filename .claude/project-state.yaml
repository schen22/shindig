approved_decisions:
  - Eleventy v3, ESM, Liquid templates; Markdown for /details
  - Embedded Google Form; no backend, no database, no serverless functions
  - Three pages only - Home, RSVP, Details
  - Netlify Free, production branch main, no branch deploys
  - One live party theme, switched at build in _data/site.js
  - Colour exists only in _data/palettes.js; one palette ships
  - No auth or password gate; robots.txt + noindex + _headers are the measures
  - No CSP - the Google Forms iframe would need allowances Google changes without notice
  - The repo does not track the Google Form's shape (no _data/form.js)
  - One live party, no archive; past parties come down
  - Layer-3 colour tokens take no fallback; --seal-size takes @supports (2026-08-17)
  - --t-faint is decorative only and never carries text (2026-08-17)
  - waxLit / waxDark are palette keys, not derived tokens (2026-08-17)
  - Fonts - Fontsource latin subset, passthrough-copied from node_modules (2026-08-17)
  - Expert panel is report-only; findings route to the file's owner
  - Parallelism is for clean merges, not speed - coordination costs most of what
    it saves on a site this size

