    note: >-
      NO LONGER BLOCKS LAUNCH. Sarah removed the [human] "real values have
      replaced the mock set" criterion from 10-launch.md on 2026-08-18 and
      reworded the .ics check to "the proposed date". The site ships with
      "TBD, aiming Saturday, Sep 5 · 2pm PT" and an .ics for that date.
      Accepted consequence: the .ics presents as a firm calendar event a date
      the page itself only proposes. Swap in real values whenever they exist.

  - id: headers-guard-is-artifact-only
    note: >-
      tests/output.js checks _site/_headers but never public/_headers. _site is
      not cleaned between builds, so a warm local tree keeps a stale copy and
      the guard passes even after public/_headers is deleted. Netlify builds
      from a clean checkout, so PRODUCTION IS PROTECTED and this is a local
      signal problem only. Declined at Stage 11 rather than fixed: the contract
      specified the _site assertion and said "Keep it to that". One line
      asserting the source file closes it whenever tests/output.js next opens.
    decided: 2026-08-18
    raised_by: L1 code-reviewer

