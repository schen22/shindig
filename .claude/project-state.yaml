  - id: wordmarks-02-04
    note: Themes 02-04 need their own wordmark. Needs Sarah.

  - id: theme-toggle-on-home
    note: >-
      Absent from / by design, since / carries no chrome at all. Decided as
      absent; revisit if it bothers you.

  - id: layer3-regex-shape
    note: >-
      tests/contrast.js discovers layer-3 tokens by regex over tokens.css, in
      the one shape the ruling sanctions: var(--t-ink) N% against --t-bg or
      transparent. A token mixing two non-ink colours would bypass the
      classify-or-fail guard rather than trip it. No such token exists and
      Stage 3 barred adding one. Revisit if layer 3 ever grows.
    decided: 2026-08-17

  - id: reviewer-model-drift
    note: >-
      06e1f9f recorded reviewers on Opus ("a reviewer that shares the builder's
      blind spots is a rubber stamp with a budget"); bbdfcd5 dissolved AGENTS.md
      into .claude/agents/ and wrote model: sonnet into code-reviewer.md and
      expert-reviewer.md, dropping the decision. Stage 3's L1 review therefore
      ran on Sonnet. Sarah ruled on 2026-08-18 that the expert panel runs on
      Sonnet; the per-agent code-reviewer is still unruled and has been
      dispatched on Opus throughout Stages 4-7.
    decided: 2026-08-17

  - id: rsvp-callout-duplication
    note: >-
      Stage 4's calloutTitle/calloutBody carry embed-fallback messaging, and
