approved_decisions:
  - Eleventy v3, ESM, Liquid templates; Markdown for /details
  - Embedded Google Form; no backend, no database, no serverless functions
  - Three pages only - Home, RSVP, Details
  - Netlify Free, production branch main, no branch deploys
  - One live party theme, switched at build in _data/site.js
  - Colour exists only in _data/palettes.js; one palette ships
  - No auth or password gate; robots.txt + noindex + _headers are the measures
  - No CSP - the Google Forms iframe would need allowances Google changes without notice
  - The repo does not track the Google Form's shape (no _data/form.js)
  - One live party, no archive; past parties come down
  - Layer-3 colour tokens take no fallback; --seal-size takes @supports (2026-08-17)
  - --t-faint is decorative only and never carries text (2026-08-17)
  - waxLit / waxDark are palette keys, not derived tokens (2026-08-17)
  - Fonts - Fontsource latin subset, passthrough-copied from node_modules (2026-08-17)
  - Expert panel is report-only; findings route to the file's owner
  - Expert panel runs on Sonnet - Sarah's call (2026-08-18), overriding the
    Opus-for-reviewers line in 06e1f9f. Matches expert-reviewer.md as written.
  - Parallelism is for clean merges, not speed - coordination costs most of what
    it saves on a site this size
  - envelope.js warms /rsvp/ with a same-origin fetch on click so the opening
    covers the round trip - Sarah's call (2026-08-18). "The page fetches
    nothing" governs external origins; this is our own page.
  - The seal turns 360deg, the theme toggle 180deg - Sarah's call (2026-08-18),
    resolving the panel's Important finding. The code was already 180deg; the
    comments claiming parity were what was wrong.
  - The envelope navigates when the opening finishes, not on a timer and not at
    click time - Sarah's call (2026-08-18). Both halves clear the viewport, so
    the swap lands on a flat --t-bg field identical to /rsvp/'s ground.
  - The calendar.google.com template link on /details is an allowed exception to
    "any other external origin, anywhere, is out of scope" - Sarah's call
    (2026-08-18). Bounded on the same grounds as the same-origin prefetch:
    nothing loads from that origin, no request is made until a guest activates
    the link, and there is no target=_blank. Closes calendar-google-origin.
  - The per-stage code-reviewer runs on Opus - Sarah's call (2026-08-18),
    matching 06e1f9f and how Stages 4-7 were actually dispatched. The expert
    panel stays on Sonnet. code-reviewer.md's "model: sonnet" line is now the
    stale one. Closes reviewer-model-drift.
  - No page-entry fade on /rsvp/ - considered and dropped (2026-08-18). Scoping
    it to that one page needed either a wrapper element in Stage 7's template
    or :has(), which shipped in Firefox 121 and breaks the 113 floor.

