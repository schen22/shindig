# Deploy config lives in the repo so it is diffable, not only in a UI (PRD §3.5).
# Base directory stays empty (the repo root, where package.json is).

[build]
  command = "npm run build:netlify"
  publish = "_site"

[build.environment]
  # NODE_ENV is deliberately NOT set here, and must not be re-added. Netlify
  # applies build.environment to the INSTALL step too, and npm skips
  # devDependencies when NODE_ENV=production — which is every dependency this
  # project has, Eleventy and lightningcss included. The production build then
  # fails before it can minify anything. Sarah hit exactly this (2026-08-18).
  #
  # Minification is not lost by removing it: package.json's `build` script sets
  # NODE_ENV=production inline on the eleventy invocation, which is the process
  # that reads it (src/assets/site.css.11ty.js:108). Verified with NODE_ENV
  # unset in the environment — 11.5 KB minified, not 37.5 KB.
  #
  # And it cannot regress in silence: tests/output.js re-renders both sheets and
  # fails the build if what reached _site is not the minified one.
  NODE_VERSION = "20"

[context.production]
  # main is the only branch that reaches the live URL. `alpha` is the integration
  # branch (AGENTS.md §3.0) and must only ever produce a branch deploy.
  #
  # NOTE: the production branch is a Netlify *site* setting and cannot be set from
  # this file. Confirm it reads `main` in the UI before the first deploy (§11).
